services:
  claudecodeui:
    image: ghcr.io/aerya/claudecodeui-docker:latest
    container_name: claudecodeui
    restart: always
    ports:
      - 3002:3001
      # Optionnel, exposer derrière reverse proxy/auth pour le viewer agentmemory
      # - 3003:3113
    environment:
      TZ: Europe/Paris
      HOST: 0.0.0.0
      SERVER_PORT: 3001
      DATABASE_PATH: /root/.cloudcli/auth.db
      WORKSPACES_ROOT: /workspace
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Une clé API non vide prend la priorité sur la connexion par abonnement.
      # Laisser ANTHROPIC_API_KEY vide pour utiliser `claude auth login` dans le terminal intégré.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # MCP / outils optionnels
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY:-}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      GITHUB_TOOLSETS: ${GITHUB_TOOLSETS:-repos,issues,pull_requests,actions,code_security}
      GITHUB_READ_ONLY: ${GITHUB_READ_ONLY:-true}
      RTK_ENABLE: ${RTK_ENABLE:-true}
      AGENTMEMORY_ENABLE: ${AGENTMEMORY_ENABLE:-true}
      AGENTMEMORY_URL: ${AGENTMEMORY_URL:-http://127.0.0.1:3111}
      AGENTMEMORY_AUTO_COMPRESS: ${AGENTMEMORY_AUTO_COMPRESS:-false}
      CONTEXT7_MCP_ENABLE: ${CONTEXT7_MCP_ENABLE:-true}
      PLAYWRIGHT_MCP_ENABLE: ${PLAYWRIGHT_MCP_ENABLE:-true}
      GITHUB_MCP_ENABLE: ${GITHUB_MCP_ENABLE:-true}
      CLAUDE_PLUGINS_BOOTSTRAP: ${CLAUDE_PLUGINS_BOOTSTRAP:-false}
      CODEX_AUTO_LOGIN: ${CODEX_AUTO_LOGIN:-true}
    volumes:
      - /home/aerya/docker/claudecodeui/cloudcli:/root/.cloudcli
      - /home/aerya/docker/claudecodeui/claude:/root/.claude
      - /home/aerya/docker/claudecodeui/codex:/root/.codex
      - /home/aerya/docker/claudecodeui/gemini:/root/.gemini
      - /home/aerya/docker/claudecodeui/agentmemory:/root/.agentmemory
      - /home/aerya/CodingOnline:/workspace/CodingOnline
      - /home/aerya/docker/claudecodeui/private-context:/workspace/private-context:ro
    working_dir: /workspace/CodingOnline

  pr-review-service:
    image: ghcr.io/aerya/claudecodeui-docker:latest
    container_name: pr-review-service
    restart: always
    environment:
      TZ: Europe/Paris
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      PR_MONITOR_ENABLED: ${PR_MONITOR_ENABLED:-true}
      PR_MONITOR_REPOSITORY: ${PR_MONITOR_REPOSITORY:-Tracker-Dashboard/tracker-dashboard}
      PR_MONITOR_INTERVAL_SECONDS: ${PR_MONITOR_INTERVAL_SECONDS:-300}
      PR_MONITOR_TIMEOUT_SECONDS: ${PR_MONITOR_TIMEOUT_SECONDS:-2700}
      PR_MONITOR_MAX_RETRIES: ${PR_MONITOR_MAX_RETRIES:-3}
      PR_MONITOR_GIT_NAME: ${PR_MONITOR_GIT_NAME:-Aerya}
      PR_MONITOR_GIT_EMAIL: ${PR_MONITOR_GIT_EMAIL:-Aerya@users.noreply.github.com}
      PR_MONITOR_CONTEXT_FILE: /workspace/private-context/tracker-dashboard/TRACKER_DASHBOARD_CONTEXT.md
    volumes:
      - /home/aerya/docker/claudecodeui/codex:/root/.codex
      - /home/aerya/docker/claudecodeui/pr-monitor:/var/lib/pr-monitor
      - /home/aerya/docker/claudecodeui/private-context:/workspace/private-context:ro
      - /home/aerya/CodingOnline:/workspace/CodingOnline
    working_dir: /workspace/CodingOnline
    command: ["/usr/local/bin/pr-monitor.sh"]
