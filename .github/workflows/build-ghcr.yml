name: Build and publish CloudCLI Docker image

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours. The workflow clones the latest upstream before building.
    - cron: "17 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-ghcr.yml"
      - "Dockerfile"
      - "scripts/**"
      - "overrides/**"
      - "compose.yml"
      - ".env.exemple"
      - "README.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: claudecodeui-docker-build
  cancel-in-progress: true

env:
  UPSTREAM_REPO: siteboon/claudecodeui
  IMAGE_BASENAME: claudecodeui-docker
  PLATFORMS: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v6

      - name: Checkout upstream CloudCLI source
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 "https://github.com/${UPSTREAM_REPO}.git" upstream

          UPSTREAM_SHA="$(git -C upstream rev-parse --short=12 HEAD)"
          CLOUDCLI_VERSION="$(node -p "require('./upstream/package.json').version")"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${IMAGE_OWNER}/${IMAGE_BASENAME}"

          echo "UPSTREAM_SHA=${UPSTREAM_SHA}" >> "$GITHUB_ENV"
          echo "CLOUDCLI_VERSION=${CLOUDCLI_VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${BUILD_DATE}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          echo "Upstream SHA: ${UPSTREAM_SHA}"
          echo "CloudCLI version: ${CLOUDCLI_VERSION}"
          echo "Image: ${IMAGE}"

      - name: Apply French locale overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/src/i18n/locales/fr
          cp -R overrides/src/i18n/locales/fr/. upstream/src/i18n/locales/fr/
          node scripts/apply-french-locale.mjs

      - name: Apply container compatibility patches
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-container-patches.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Pre-pull BuildKit image
        shell: bash
        # Buildx boots its builder from moby/buildkit on Docker Hub. Docker Hub
        # occasionally times out from GitHub runners, which fails the whole run.
        # Pre-pulling with retries puts the image in the local cache so the
        # builder boots without touching the registry. Never fail the job here:
        # if every attempt times out, let buildx try its own pull afterwards.
        run: |
          set -euo pipefail
          image="moby/buildkit:buildx-stable-1"
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              echo "Pulled ${image} on attempt ${attempt}"
              exit 0
            fi
            echo "Pull attempt ${attempt} failed; retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::warning::Could not pre-pull ${image} after 5 attempts; buildx will attempt its own pull"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=moby/buildkit:buildx-stable-1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          pull: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.UPSTREAM_SHA }}
            ${{ env.IMAGE }}:v${{ env.CLOUDCLI_VERSION }}
          labels: |
            org.opencontainers.image.title=CloudCLI Docker
            org.opencontainers.image.source=https://github.com/siteboon/claudecodeui
            org.opencontainers.image.version=${{ env.CLOUDCLI_VERSION }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
          build-args: |
            CLOUDCLI_VERSION=${{ env.CLOUDCLI_VERSION }}
            UPSTREAM_SHA=${{ env.UPSTREAM_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
