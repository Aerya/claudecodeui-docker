name: Validation Docker PR

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "Dockerfile.*"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - "docker-compose.yml"
      - "compose.yml"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "requirements*.txt"
      - "**/requirements*.txt"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/docker-pr.yml"

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Préparer les sources amont
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/siteboon/claudecodeui.git upstream
          echo "CLOUDCLI_VERSION=$(node -p "require('./upstream/package.json').version")" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          mkdir -p upstream/src/i18n/locales/fr
          cp -R overrides/src/i18n/locales/fr/. upstream/src/i18n/locales/fr/
          node scripts/apply-french-locale.mjs
          node scripts/apply-container-patches.mjs
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Construire sans publier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          pull: true
          build-args: |
            CLOUDCLI_VERSION=${{ env.CLOUDCLI_VERSION }}
            UPSTREAM_SHA=${{ env.UPSTREAM_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
